[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flockkalman-research"
version = "0.19.0"
description = "Reproducible research platform for flocking policies and distributed Kalman filtering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
flockkalman = "flockkalman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
